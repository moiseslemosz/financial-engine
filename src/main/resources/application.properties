spring.application.name=motor-financeiro
server.port=8080
logging.level.root=INFO
logging.level.com.motorfinanceiro=DEBUG
fii.health-check.test-ticker=MXRF11
 
# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:motor_financeiro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:troque_esta_senha}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# ===== FASE 3 — Spring AI + Gemini =====
# Obtenha sua chave gratuita em: https://aistudio.google.com
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
# Temperatura 0.3 = respostas mais consistentes e menos criativas (ideal para análise financeira)
spring.ai.google.genai.chat.options.temperature=0.3

# ── AI Fallback Chain ─────────────────────────────────────────────
# Modelos tentados na ordem. Se o primeiro esgotar cota ou der
# timeout, o sistema tenta automaticamente o próximo.
#
# Limites (nível gratuito Google AI Studio):
#   gemini-2.5-flash       →  20 RPD   (melhor qualidade)
#   gemini-1.5-flash       →  1.500 RPD
#   gemini-3.1-flash-lite  →  500 RPD  (último recurso)
#
ai.models.chain=gemini-2.5-flash,gemini-1.5-flash,gemini-3.1-flash-lite
 
# Temperatura: 0.0 = determinístico, 1.0 = criativo
# 0.3 é ideal para análise financeira estruturada
ai.models.temperature=0.3

# BRAPI_TOKEN
# Plano gratuito: 1.000 requisições/mês
brapi.api.token=${BRAPI_TOKEN:}